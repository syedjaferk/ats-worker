name: Tests

# The tests fake the model, Drive and the portal, so no secrets are needed here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest -v

      - name: run.sh is valid shell
        run: sh -n run.sh
